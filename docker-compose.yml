services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: cv-finaxys-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartcv
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartcv"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  # L'API Python (Le Cerveau)
  cv-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-cv-app:latest # On donne un nom fixe à l'image
    container_name: cv-finaxys-api
    ports:
      - "8000:8000"
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./input:/app/input
    environment:
      - DISABLE_DOCLING=1
      - PGVECTOR_DSN=postgresql://postgres:postgres@pgvector:5432/smartcv
    env_file: .env
    depends_on:
      pgvector:
        condition: service_healthy
    restart: always

  # Interface web RH (remplace l'ancien bot Telegram — utilise la MÊME image que l'API)
  cv-streamlit:
    image: smart-cv-app:latest # Utilise l'image construite par cv-api
    container_name: cv-finaxys-streamlit
    command: streamlit run streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./input:/app/input
      - ./cv_originals:/app/cv_originals
      - hf_cache:/home/appuser/.cache/huggingface  # Cache modèles HuggingFace persistant
    environment:
      - DISABLE_HEALTHCHECK=true
      - PGVECTOR_DSN=postgresql://postgres:postgres@pgvector:5432/smartcv
    env_file: .env
    depends_on:
      cv-api:
        condition: service_started
      pgvector:
        condition: service_healthy
    restart: always

volumes:
  pgvector_data:
  hf_cache:  # Cache persistant pour les modèles HuggingFace (bge-m3, reranker)
