name: Finaxys CV Intelligence CI

on:
  push:
    branches: [ main, feature/rag-integration ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Run Pytest (Structural Only)
      run: |
        # On lance les tests qui ne nécessitent pas de clé API réelle
        pytest -v -m "not needs_llm"
      env:
        LLM_PROVIDER: openai
        OPENAI_API_KEY: "fake-key-for-ci"

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build API Image (Dry Run)
      run: |
        docker build -t cv-api-test .
      # On ne pousse pas l'image, on vérifie juste qu'elle se build sans erreur.

    - name: Docker Compose Config Check
      run: |
        # On vérifie que le fichier compose est valide (sans lancer les services)
        docker compose config
