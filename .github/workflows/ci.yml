name: Smart-CV CI (Tests & Docker Build)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # On définit les variables d'environnement nécessaires pour les tests (simulées pour la CI)
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DISABLE_DOCLING: 1 # On désactive Docling en CI pour gagner du temps/ressources

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx
        
    - name: Run Pytest (Parser & Validator)
      run: |
        pytest tests/test_parser.py tests/test_validator.py
        
  build_docker:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build CV-API Docker Image
      run: |
        docker build . -t smart-cv-api:latest
        
    - name: Build OpenClaw Docker Image
      run: |
        docker build -f Dockerfile.bot . -t smart-cv-bot:latest
