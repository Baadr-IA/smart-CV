global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "smartcv-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["cv-api:8000"]

  - job_name: "smartcv-bot"
    honor_labels: true
    static_configs:
      - targets: ["smartcv-pushgateway:9091"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
